services:
  workspace:
    image: mcr.microsoft.com/devcontainers/java:1-21-bookworm
    command: sleep infinity
    volumes:
      - ..:/workspaces/baseKit:cached
    environment:
      BASEKIT_DB_URL: jdbc:postgresql://database:5432/basekit
      BASEKIT_DB_USERNAME: basekit
      BASEKIT_DB_PASSWORD: basekit
      SPRING_PROFILES_ACTIVE: codespace
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: basekit
      POSTGRES_USER: basekit
      POSTGRES_PASSWORD: basekit
    volumes:
      - basekit-postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U basekit -d basekit"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  basekit-postgres-data:
